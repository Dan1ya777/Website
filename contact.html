<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        <title>Contact</title>
    </head>
    <body>
        <nav>
            <ul>
                <li><a href="index.html"><img src="images/logo.png" alt="logo"></a></li>
                <li><a class="active" href="index.html">Home</a></li>
                <li><a href="collection.html">Collection</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <div class="right-side">
                    <li><input type="text" placeholder="Search"></li>
                    <li><a href="favourites.html"><i class="material-icons">favorite</i></a></li>
                    <li><a href="cart.html"><i class="material-icons">shopping_cart</i></a></li>
                </div>
            </ul>
        </nav>
        
        <h1>Contact Us</h1>
        <div class="contact-content">
            <div class="contact-form">
                <h2>Send Your Message</h2>
                <form action="https://formspree.io/f/xdeonqoo" method="POST">
                    <label>
                        First Name:
                        <textarea name="firstname"></textarea>
                    </label>
                    <label>
                        Last Name:
                        <textarea name="lastname"></textarea>
                    </label>
                    <label>
                        Email:
                        <input type="email" name="email">
                    </label>
                    <label>
                        Your message:
                        <textarea name="message"></textarea>
                    </label>
                    <button type="submit">Send</button>
                </form>
            </div>
            <div class="contact-info">
                <h2>Our Contact Information</h2>
                <p>Phone number</p>
                <p>Email</p>
            </div>
        </div>

        <footer>
            <div class="footer-content">
                <div class="links">
                    <a href="aboutus.html">About Us</a>
                    <a href="contact.html">Contact</a>
                </div>
                <div class="copyright">
                    <p>@Copyright</p>
                </div>
                <div class="social-medias">
                    <p>Our social medias</p>
                    <img src="images/youtube.png" alt="youtube">
                    <img src="images/tiktok.png" alt="tiktok">
                    <img src="images/instagram.png" alt="instagram">
                    <img src="images/facebook.png" alt="facebook">
                </div>
        </footer>
    </body>
</html>
